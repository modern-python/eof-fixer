[project]
name = "eof-fixer"
description = "CLI tool that ensures text files end with exactly one newline"
license = "MIT"
readme = "README.md"
requires-python = ">=3.10,<4"
dependencies = [
    "pathspec",
]
version = "0"
authors = [{ name = "modern-python" }]
keywords = [
    "cli",
    "pre-commit",
    "formatter",
    "newline",
    "eof",
    "linter",
    "python",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Typing :: Typed",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://modern-python.org"
Repository = "https://github.com/modern-python/eof-fixer"
Issues = "https://github.com/modern-python/eof-fixer/issues"
Changelog = "https://github.com/modern-python/eof-fixer/releases"

[project.scripts]
eof-fixer = "eof_fixer.main:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
]
lint = [
    "ruff",
    "ty",
]

[build-system]
requires = ["uv_build>=0.11,<1.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "eof_fixer"
module-root = ""

[tool.ruff]
fix = true
unsafe-fixes = true
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D1",     # docstrings are not forced; a docstring exists when it says something
    "D203",   # conflicts with D211
    "D213",   # conflicts with D212
    "COM812", # conflicts with the formatter
    "ISC001", # conflicts with the formatter
    "CPY001", # no per-file copyright header
    "FBT",    # boolean positional arguments are fine
    "TCH",    # imports stay real; TYPE_CHECKING-only imports break runtime introspection
]
isort.lines-after-imports = 2
isort.no-lines-before = ["standard-library", "local-folder"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
addopts = ""

[tool.coverage]
run.concurrency = ["thread"]
report.exclude_also = ["if typing.TYPE_CHECKING:"]
report.fail_under = 100
